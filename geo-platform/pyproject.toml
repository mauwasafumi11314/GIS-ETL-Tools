[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoplatform"
version = "0.1.0"
description = "PostGIS-backed vector tile API and ETL pipeline for spatial data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Masafumi Matsushita" }]
keywords = ["gis", "postgis", "vector-tiles", "fastapi", "geospatial", "etl"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# Heavy geo stack, only needed to run the loader - the API image stays slim.
etl = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
geoplatform-etl = "geoplatform.etl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:geoplatform.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
