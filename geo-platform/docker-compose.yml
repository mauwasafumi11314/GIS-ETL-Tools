name: geo-platform

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoplatform}
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, in filename order, on first startup.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geoplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-geoplatform}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    # Vite is installed on first boot into a named volume so node_modules never
    # leaks into the bind-mounted source tree.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - api

  # One-shot loader: docker compose run --rm etl load /data --recursive
  etl:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-geoplatform}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
