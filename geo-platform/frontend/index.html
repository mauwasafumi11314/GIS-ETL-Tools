<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoPlatform</title>
    <meta name="description" content="Vector tiles served from PostGIS, rendered with MapLibre." />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>GeoPlatform</h1>

      <main id="map"></main>

    <script type="module" src="/src/main.js"></script>
